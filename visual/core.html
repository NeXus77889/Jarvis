<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS Core</title>
<style>
  :root { --bg: #030101; --hot: #ff5a1f; --warm: #ffb36b; --dim: #8a3512; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); cursor: none; }
  body { background: radial-gradient(ellipse at 50% 50%, #140703 0%, #070202 48%, #010000 100%); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #bloom { filter: blur(8px) brightness(1.9); mix-blend-mode: screen; opacity: .95; }
  #halo { filter: blur(32px) brightness(1.5); mix-blend-mode: screen; opacity: .85; }
  #hint { position:fixed; z-index:4; left:50%; top:14px; transform:translateX(-50%); color:#d78752; font:10px Consolas,monospace; opacity:.75; pointer-events:none; text-align:center; }
</style>
</head>
<body>
<canvas id="halo"></canvas>
<canvas id="bloom"></canvas>
<canvas id="main"></canvas>
<div id="hint"></div>

<script>
"use strict";
/* ------------------------------------------------------------------
   Núcleo JARVIS — explorador de espacio profundo.
   Todo es decorativo salvo lo marcado: hora, modo, volumen de voz,
   rastreo facial y profundidad de zoom son datos reales.
   Cuanto más profundo el zoom ("depth" 0..1), más capas de detalle aparecen.
   Parámetros URL: ?demo=1  ?mode=speaking  ?depth=0.8  ?level=0.6
   ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const main = document.getElementById("main"), cx = main.getContext("2d");
const bloom = document.getElementById("bloom"), bx = bloom.getContext("2d");
const halo = document.getElementById("halo"), hx = halo.getContext("2d");

let W = 0, H = 0, DPR = 1, RPX = 200, U = 1;
let userDepth = null, zoomOut = 0, routePulse = 0, routeFrom = [0,0], routeTo = [0,0];
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  main.width = Math.round(W * DPR); main.height = Math.round(H * DPR);
  bloom.width = Math.round(W / 4); bloom.height = Math.round(H / 4);
  halo.width = Math.round(W / 8); halo.height = Math.round(H / 8);
  RPX = 0.2 * Math.min(W, H); U = Math.min(W / 1280, H / 720);
}
addEventListener("resize", resize); resize();

const LABELS = { idle: "EN ESPERA", listening: "ESCUCHANDO", heard: "ACTIVADO", thinking: "PROCESANDO", speaking: "HABLANDO" };
const SPIN = { idle: 0.22, listening: 0.45, heard: 1.3, thinking: 1.6, speaking: 0.7 };
const GLOW = { idle: 0.8, listening: 1.0, heard: 1.25, thinking: 1.15, speaking: 1.05 };
const S = { mode: "idle", level: 0, depth: 0, spin: 0.22, glow: 0.8, fx: 0, fy: 0, dragX: 0, dragY: 0, handRot: 0, face: false };
const target = { mode: "idle", level: 0, fx: 0, fy: 0, handZoom: -1, handRot: 0, face: false };
const forcedDepth = params.has("depth") ? +params.get("depth") : null;

/* ---------- utilidades ---------- */
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const R = rnd(11);
const hash = (a, b) => { let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };
const hex4 = n => ("000" + (n & 0xffff).toString(16)).slice(-4).toUpperCase();
const mul = (a, b) => [
  a[0]*b[0]+a[1]*b[3]+a[2]*b[6], a[0]*b[1]+a[1]*b[4]+a[2]*b[7], a[0]*b[2]+a[1]*b[5]+a[2]*b[8],
  a[3]*b[0]+a[4]*b[3]+a[5]*b[6], a[3]*b[1]+a[4]*b[4]+a[5]*b[7], a[3]*b[2]+a[4]*b[5]+a[5]*b[8],
  a[6]*b[0]+a[7]*b[3]+a[8]*b[6], a[6]*b[1]+a[7]*b[4]+a[8]*b[7], a[6]*b[2]+a[7]*b[5]+a[8]*b[8]];
const Rx = a => { const c = Math.cos(a), s = Math.sin(a); return [1,0,0, 0,c,-s, 0,s,c]; };
const Ry = a => { const c = Math.cos(a), s = Math.sin(a); return [c,0,s, 0,1,0, -s,0,c]; };
const Rz = a => { const c = Math.cos(a), s = Math.sin(a); return [c,-s,0, s,c,0, 0,0,1]; };

/* ---------- geometría ---------- */
const N = 4200;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const prad = new Float32Array(N), pph = new Float32Array(N), psz = new Float32Array(N);
const GOLD = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const shell = R() < 0.72, y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * GOLD;
  px[i] = Math.cos(th) * r; py[i] = y; pz[i] = Math.sin(th) * r;
  prad[i] = shell ? 0.96 + R() * 0.06 : 0.35 + R() * 0.6; pph[i] = R(); psz[i] = 0.55 + R() * 1.1;
}
/* capa fina interior (aparece al hacer mucho zoom) */
const NQ = 1500, qx = new Float32Array(NQ), qy = new Float32Array(NQ), qz = new Float32Array(NQ);
for (let i = 0; i < NQ; i++) {
  const y = 1 - 2 * (i + 0.5) / NQ, r = Math.sqrt(1 - y * y), th = i * GOLD, k = 0.50 + R() * 0.22;
  qx[i] = Math.cos(th) * r * k; qy[i] = y * k; qz[i] = Math.sin(th) * r * k;
}
/* galaxia lejana */
const NG = 2600, gx = new Float32Array(NG), gy = new Float32Array(NG), gz = new Float32Array(NG), gb = new Uint8Array(NG);
for (let i = 0; i < NG; i++) {
  const arm = i % 3, r = Math.pow(R(), 0.62) * 3.4, a = r * 1.35 + arm * TAU / 3 + (R() - 0.5) * 0.5 * (0.4 + r * 0.25);
  gx[i] = Math.cos(a) * r; gz[i] = Math.sin(a) * r; gy[i] = (R() - 0.5) * 0.10 * (1.3 - r / 4);
  gb[i] = r < 0.9 ? 0 : r < 2.0 ? 1 : 2;
}
/* campo de estrellas con vuelo */
const NS = 650, sx3 = new Float32Array(NS), sy3 = new Float32Array(NS), sz3 = new Float32Array(NS), ssz = new Float32Array(NS);
for (let i = 0; i < NS; i++) { sx3[i] = (R() * 2 - 1) * 4.5; sy3[i] = (R() * 2 - 1) * 3; sz3[i] = (R() * 2 - 1) * 4; ssz[i] = 0.5 + R() * 1.2; }

const PHI = (1 + Math.sqrt(5)) / 2;
function icosa() {
  const raw = [[-1,PHI,0],[1,PHI,0],[-1,-PHI,0],[1,-PHI,0],[0,-1,PHI],[0,1,PHI],[0,-1,-PHI],[0,1,-PHI],[PHI,0,-1],[PHI,0,1],[-PHI,0,-1],[-PHI,0,1]];
  const n = Math.hypot(1, PHI), v = raw.map(p => p.map(c => c / n)), e = [];
  for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
    const d = Math.hypot(v[i][0]-v[j][0], v[i][1]-v[j][1], v[i][2]-v[j][2]);
    if (Math.abs(d - 2 / n) < 1e-6) e.push([i, j]);
  }
  return { v, e };
}
const ICO = icosa();

/* ---------- cámara ---------- */
let CAM_D = 5, CAM_F = 1, CX = 0, CY = 0;
function project(x, y, z, out) {
  const den = CAM_D - z;
  if (den < 0.28) return false;
  const s = CAM_F / den;
  out[0] = CX + x * s; out[1] = CY - y * s; out[2] = s / RPX; return true;
}
const PT = [0, 0, 0], PT2 = [0, 0, 0];

/* ---------- texto ---------- */
function txt(s, x, y, a, size, align, col) {
  cx.font = `${size}px Consolas, "Courier New", monospace`; cx.textAlign = align || "left";
  cx.fillStyle = `rgba(${col || "255,176,110"},${a})`; cx.fillText(s, x, y);
}

/* ---------- elementos 3D ---------- */
const BUCKETS = 9, bucketColor = [];
for (let b = 0; b < BUCKETS; b++) {
  const k = b / (BUCKETS - 1);
  bucketColor.push(`rgb(${Math.round(175 + 80 * k)},${Math.round(22 + 105 * k * k)},${Math.round(6 + 36 * k * k * k)})`);
}
const bk = new Uint8Array(N), bsx = new Float32Array(N), bsy = new Float32Array(N), bsz = new Float32Array(N);

function drawRing(M, radius, ticks, dashLen, gapLen, t, alpha, width, nodes, deg) {
  const n = 200, front = new Path2D(), back = new Path2D();
  const stepRot = Math.floor(t * 6) % (dashLen + gapLen);
  let pv = null, pvz = 0;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU, lx = Math.cos(a) * radius, ly = Math.sin(a) * radius;
    const x = M[0]*lx + M[1]*ly, y = M[3]*lx + M[4]*ly, z = M[6]*lx + M[7]*ly;
    const ok = project(x, y, z, PT), cur = ok ? [PT[0], PT[1]] : null;
    const dashOn = gapLen === 0 || ((i + stepRot) % (dashLen + gapLen)) < dashLen;
    if (cur && pv && dashOn) { const p = (z + pvz) > 0 ? front : back; p.moveTo(pv[0], pv[1]); p.lineTo(cur[0], cur[1]); }
    if (ticks && cur && i % ticks === 0) {
      const o = 1.07, tx = M[0]*lx*o + M[1]*ly*o, ty = M[3]*lx*o + M[4]*ly*o, tz = M[6]*lx*o + M[7]*ly*o;
      if (project(tx, ty, tz, PT2)) { const p = z > 0 ? front : back; p.moveTo(cur[0], cur[1]); p.lineTo(PT2[0], PT2[1]); }
      if (deg > 0.02 && z > 0 && i % (ticks * 5) === 0) txt(String(Math.round(a / TAU * 360)).padStart(3, "0") + "°", PT2[0], PT2[1] - 4, 0.8 * deg * alpha, 9 * U + 2, "center");
    }
    pv = cur; pvz = z;
  }
  cx.lineWidth = width;
  cx.strokeStyle = `rgba(255,120,50,${0.24 * alpha})`; cx.stroke(back);
  cx.strokeStyle = `rgba(255,170,95,${0.95 * alpha})`; cx.stroke(front);
  /* satélites con etiqueta que orbitan el anillo */
  if (nodes && nodes.vis > 0.02) {
    for (const nd of nodes.list) {
      const a = t * nd.sp + nd.ph, lx = Math.cos(a) * radius, ly = Math.sin(a) * radius;
      const x = M[0]*lx + M[1]*ly, y = M[3]*lx + M[4]*ly, z = M[6]*lx + M[7]*ly;
      if (!project(x, y, z, PT)) continue;
      const v = nodes.vis * (z > -0.2 ? 1 : 0.25);
      cx.fillStyle = `rgba(255,225,170,${0.95 * v})`;
      cx.beginPath(); cx.moveTo(PT[0], PT[1] - 4.5); cx.lineTo(PT[0] + 4.5, PT[1]); cx.lineTo(PT[0], PT[1] + 4.5); cx.lineTo(PT[0] - 4.5, PT[1]); cx.fill();
      if (z > -0.2) {
        cx.strokeStyle = `rgba(255,150,80,${0.5 * v})`; cx.lineWidth = 1;
        cx.beginPath(); cx.moveTo(PT[0] + 5, PT[1] - 5); cx.lineTo(PT[0] + 22, PT[1] - 20); cx.lineTo(PT[0] + 52, PT[1] - 20); cx.stroke();
        txt(nd.name, PT[0] + 26, PT[1] - 24, 0.9 * v, 9 * U + 2);
        txt(((a % TAU) / TAU * 360).toFixed(1) + "°", PT[0] + 26, PT[1] - 13, 0.55 * v, 8 * U + 2);
      }
    }
  }
}
function drawWire(M, size, alpha, nodes) {
  const pts = ICO.v.map(v => { const x = v[0]*size, y = v[1]*size, z = v[2]*size;
    const X = M[0]*x+M[1]*y+M[2]*z, Y = M[3]*x+M[4]*y+M[5]*z, Z = M[6]*x+M[7]*y+M[8]*z;
    return project(X, Y, Z, PT) ? [PT[0], PT[1], Z] : null; });
  cx.lineWidth = 1; cx.beginPath();
  for (const [a, b] of ICO.e) { const p = pts[a], q = pts[b]; if (p && q) { cx.moveTo(p[0], p[1]); cx.lineTo(q[0], q[1]); } }
  cx.strokeStyle = `rgba(255,140,70,${0.5 * alpha})`; cx.stroke();
  if (nodes) { cx.fillStyle = `rgba(255,210,150,${0.95 * alpha})`; for (const p of pts) if (p) cx.fillRect(p[0] - 1.6, p[1] - 1.6, 3.2, 3.2); }
}
const NODES = [
  { vis: 0, list: [{ ph: 0.4, sp: 0.35, name: "NODO-07" }, { ph: 3.1, sp: 0.35, name: "NODO-12" }] },
  { vis: 0, list: [{ ph: 1.7, sp: -0.28, name: "SECTOR-A3" }, { ph: 4.4, sp: -0.28, name: "SECTOR-B9" }] },
  { vis: 0, list: [{ ph: 2.3, sp: 0.2, name: "ÓRBITA-41" }, { ph: 5.2, sp: 0.2, name: "ÓRBITA-58" }, { ph: 0.2, sp: 0.2, name: "ÓRBITA-63" }] },
];

/* ---------- fondo: nebulosa, galaxia, estrellas ---------- */
function drawNebula(d) {
  const blobs = [[0.30, 0.38, 0.55, "150,40,15", 0.12], [0.74, 0.62, 0.50, "110,25,70", 0.09], [0.55, 0.20, 0.42, "180,80,25", 0.06]];
  for (const [bxn, byn, rn, col, a] of blobs) {
    const x = W * bxn - S.fx * 22 + Math.sin(T * 0.05 + bxn * 9) * 18, y = H * byn + S.fy * 16 + Math.cos(T * 0.04 + byn * 7) * 14, r = W * rn;
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a * (0.9 + 0.5 * d)})`); g.addColorStop(1, `rgba(${col},0)`);
    cx.fillStyle = g; cx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}
const GCOL = ["255,215,160", "255,120,55", "190,60,60"];
const gsx = new Float32Array(NG), gsy = new Float32Array(NG), gok = new Uint8Array(NG);
function drawGalaxy(world, a) {
  if (a < 0.01) return;
  const M = mul(world, mul(Rx(1.08), Ry(T * 0.025)));
  for (let i = 0; i < NG; i++) {
    const x = M[0]*gx[i] + M[1]*gy[i] + M[2]*gz[i], y = M[3]*gx[i] + M[4]*gy[i] + M[5]*gz[i], z = M[6]*gx[i] + M[7]*gy[i] + M[8]*gz[i];
    gok[i] = project(x, y - 0.0, z - 1.5, PT) ? 1 : 0; gsx[i] = PT[0]; gsy[i] = PT[1];
  }
  for (let b = 0; b < 3; b++) {
    cx.fillStyle = `rgba(${GCOL[b]},${a * (b === 0 ? 0.9 : b === 1 ? 0.5 : 0.35)})`;
    for (let i = 0; i < NG; i++) if (gok[i] && gb[i] === b) cx.fillRect(gsx[i], gsy[i], 1.3, 1.3);
  }
}
let flight = 0;
function drawStars(dt, a, speed) {
  flight += dt * (0.04 + speed * 2.4);
  for (let i = 0; i < NS; i++) {
    const z = ((sz3[i] + flight + 4) % 8) - 4, ps = Math.max(0, speed) * 0.12;
    if (!project(sx3[i], sy3[i], z * 0.6, PT)) continue;
    const near = Math.min(1, Math.max(0.15, (z + 4) / 8));
    cx.fillStyle = `rgba(255,${200 + near * 40 | 0},${170 + near * 60 | 0},${a * (0.25 + near * 0.6)})`;
    const sz = ssz[i] * (0.6 + near * 1.3);
    if (ps > 0.01 && project(sx3[i], sy3[i], (z - ps * 4) * 0.6, PT2)) {
      cx.strokeStyle = cx.fillStyle; cx.lineWidth = sz * 0.7; cx.beginPath(); cx.moveTo(PT2[0], PT2[1]); cx.lineTo(PT[0], PT[1]); cx.stroke();
    } else cx.fillRect(PT[0], PT[1], sz, sz);
  }
}

/* ---------- HUD de pantalla: paneles, reglas, retícula ---------- */
const hist = new Array(72).fill(0);
function box(x, y, w, h, a, title) {
  cx.fillStyle = `rgba(30,8,3,${0.38 * a})`; cx.fillRect(x, y, w, h);
  cx.lineWidth = 1; cx.strokeStyle = `rgba(255,120,60,${0.32 * a})`; cx.strokeRect(x + 0.5, y + 0.5, w, h);
  const c = 11 * U + 3; cx.strokeStyle = `rgba(255,195,135,${0.95 * a})`; cx.beginPath();
  cx.moveTo(x, y + c); cx.lineTo(x, y); cx.lineTo(x + c, y);
  cx.moveTo(x + w - c, y + h); cx.lineTo(x + w, y + h); cx.lineTo(x + w, y + h - c); cx.stroke();
  txt(title, x + 10 * U, y + 15 * U + 2, 0.95 * a, 10 * U + 2);
  cx.strokeStyle = `rgba(255,120,60,${0.35 * a})`; cx.beginPath(); cx.moveTo(x + 8 * U, y + 22 * U + 2); cx.lineTo(x + w - 8 * U, y + 22 * U + 2); cx.stroke();
}
function pSpectrum(x, y, w, h, a) {
  const n = 30, bw = (w - 20 * U) / n, base = y + h - 10 * U, maxh = h - 40 * U;
  for (let k = 0; k < n; k++) {
    const v = Math.min(1, (0.07 + S.level * 0.95) * (0.3 + 0.7 * Math.abs(Math.sin(T * 3.1 + k * 0.63) * Math.cos(T * 1.7 + k * 0.31))));
    cx.fillStyle = `rgba(255,${110 + v * 90 | 0},60,${0.85 * a})`; cx.fillRect(x + 10 * U + k * bw, base - v * maxh, bw - 2, v * maxh);
  }
}
function pHex(x, y, w, h, a) {
  const rows = Math.floor((h - 34 * U) / (13 * U + 1)), f = Math.floor(T * 3);
  for (let r = 0; r < rows; r++) {
    const line = `0x${hex4(hash(r, 7))}  ${hex4(hash(r + f, 1))} ${hex4(hash(r + f, 2))} ${hex4(hash(r + f * 2, 3))}`;
    txt(line, x + 10 * U, y + 38 * U + r * (13 * U + 1), (0.45 + 0.4 * ((r + f) % 3 === 0)) * a, 9 * U + 2);
  }
}
function pScope(x, y, w, h, a) {
  const mid = y + h * 0.58, amp = (h - 44 * U) * 0.5;
  cx.strokeStyle = `rgba(255,120,60,${0.2 * a})`; cx.beginPath(); cx.moveTo(x + 8 * U, mid); cx.lineTo(x + w - 8 * U, mid); cx.stroke();
  cx.strokeStyle = `rgba(255,185,120,${0.95 * a})`; cx.lineWidth = 1.4; cx.beginPath();
  const n = hist.length;
  for (let i = 0; i < n; i++) {
    const px_ = x + 8 * U + (i / (n - 1)) * (w - 16 * U), v = (0.06 + hist[i]) * Math.sin(i * 0.9 + T * 9) * amp;
    i ? cx.lineTo(px_, mid - v) : cx.moveTo(px_, mid - v);
  }
  cx.stroke(); cx.lineWidth = 1;
}
function pGauge(x, y, w, h, a) {
  const gcx = x + w * 0.32, gcy = y + h * 0.6, r = Math.min(w * 0.24, h * 0.34);
  for (let i = 0; i < 3; i++) {
    const rr = r - i * 9 * U, a0 = T * (0.8 + i * 0.5) * (i % 2 ? -1 : 1);
    cx.strokeStyle = `rgba(255,${150 + i * 25},${90 + i * 20},${(0.9 - i * 0.2) * a})`; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(gcx, gcy, rr, a0, a0 + 3.6 - i * 0.7); cx.stroke();
  }
  cx.lineWidth = 1;
  txt(Math.round(S.depth * 100) + "%", gcx, gcy + 5, 0.95 * a, 15 * U + 3, "center");
  txt("PROFUNDIDAD", x + w * 0.62, y + h * 0.45, 0.8 * a, 9 * U + 2);
  txt("ESCALA 1:" + (1 + Math.round(S.depth * 46)), x + w * 0.62, y + h * 0.6, 0.55 * a, 9 * U + 2);
}
function pLink(x, y, w, h, a) {
  const rows = [["VOZ", LABELS[S.mode] || "EN ESPERA"], ["CÁMARA", S.face ? "RASTREANDO" : "SIN ROSTRO"], ["NÚCLEO", "ESTABLE"], ["ENLACE", "ACTIVO"], ["HORA", new Date().toLocaleTimeString("es-EC", { hour12: false })]];
  rows.forEach((r, i) => { const yy = y + 40 * U + i * 15 * U; txt(r[0], x + 10 * U, yy, 0.6 * a, 9 * U + 2); txt(r[1], x + w - 10 * U, yy, 0.95 * a, 9 * U + 2, "right"); });
}
function pCoords(x, y, w, h, a) {
  const f = n => (n >= 0 ? "+" : "−") + Math.abs(n).toFixed(3).padStart(7, "0");
  const X = S.face ? S.fx : Math.sin(T * 0.31), Y = S.face ? S.fy : Math.cos(T * 0.27), Z = Math.sin(T * 0.13);
  [["X", X], ["Y", Y], ["Z", Z]].forEach((c, i) => { txt(c[0], x + 10 * U, y + 42 * U + i * 17 * U, 0.6 * a, 10 * U + 2); txt(f(c[1]), x + w - 10 * U, y + 42 * U + i * 17 * U, 0.95 * a, 10 * U + 2, "right"); });
  txt("FASE " + (T * 12 % 360).toFixed(1) + "°", x + 10 * U, y + h - 10 * U, 0.5 * a, 9 * U + 2);
}
const PANELS = [
  { side: -1, row: 0, th: 0.26, title: "ESPECTRO DE VOZ", fn: pSpectrum },
  { side: 1, row: 0, th: 0.34, title: "OSCILOSCOPIO", fn: pScope },
  { side: -1, row: 1, th: 0.50, title: "FLUJO DE DATOS", fn: pHex },
  { side: 1, row: 1, th: 0.60, title: "SECTOR / PROFUNDIDAD", fn: pGauge },
  { side: -1, row: 2, th: 0.74, title: "COORDENADAS", fn: pCoords },
  { side: 1, row: 2, th: 0.84, title: "ESTADO DEL SISTEMA", fn: pLink },

  let t = T % SEQ.reduce((a, s) => a + s[1], 0), m = "idle";
  for (const [name, dd] of SEQ) { if (t < dd) { m = name; break; } t -= dd; }
  target.mode = m;
  target.level = m === "speaking" ? 0.3 + 0.5 * Math.abs(Math.sin(T * 6.5)) * Math.abs(Math.sin(T * 2.1)) : m === "listening" ? 0.15 + 0.25 * Math.abs(Math.sin(T * 5)) : 0;
}, 33);
requestAnimationFrame(frame);
</script>
